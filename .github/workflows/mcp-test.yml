name: mcp test
on:
  push:
    paths: ["mcp/**", "plugins/**", "tools/cortex-init.sh", "VERSION", ".github/workflows/mcp-test.yml"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # Git Bash exists on the Windows runners, so one shell covers the whole matrix.
    shell: bash

jobs:
  test:
    # Windows is the primary development platform for this repo and lib/capture.js carries
    # explicit path-separator handling, so it has to be exercised here — not just on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (for sync tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Test mcp
        working-directory: mcp
        run: npm test
      # core/ and index/ have no dependencies of their own — they run straight off the checkout.
      # Separate steps so a failure names the layer that broke.
      #
      # `shell: bash` on purpose: the shell expands the glob and Node receives explicit paths.
      # `node --test <dir>` works on Node 20 but not 24, and Node's own glob expansion is the
      # other way round — passing filenames sidesteps both.
      - name: Test core
        shell: bash
        run: node --test core/test/*.test.js
      - name: Test index
        shell: bash
        run: node --test index/test/*.test.mjs
