name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step — the package has zero runtime dependencies by design,
      # and `npm run check:egress` fails the build if that ever stops being true.
      - run: npm test
      - run: npm run check:egress
