name: cortex-init test

on:
  push:
    paths:
      - "tools/**"
      - "mcp/lib/cortexignore.js"
      - ".cortexignore"
      - ".github/workflows/cortex-init-test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: smoke (bash, no runtime deps)
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          set -euo pipefail
          # Glob rather than a hand-maintained list — a new tool was previously missed here.
          # `tools/*.sh` alone does not match `tools/server/*.sh`, which left cortex-cron.sh and
          # server-setup.sh unparsed and unchecked; both globs are needed.
          for f in tools/*.sh tools/server/*.sh; do bash -n "$f" && echo "parsed  $f"; done

      - name: Shellcheck (errors block)
        run: shellcheck -S error tools/*.sh tools/server/*.sh

      - name: Shellcheck (warnings, informational)
        continue-on-error: true
        run: shellcheck -S warning tools/*.sh tools/server/*.sh

      - name: knowledge_files() honours .cortexignore
        run: |
          set -euo pipefail
          . tools/_cortex-lib.sh
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/notes" "$WORK/docs" "$WORK/.agents/vendor" "$WORK/context/.backups"
          printf 'docs/\n.agents/\n.backups/\n*.example.md\nREADME.md\n' > "$WORK/.cortexignore"
          : > "$WORK/notes/keep.md"
          : > "$WORK/notes/README.md"
          : > "$WORK/home.example.md"
          : > "$WORK/docs/drop.md"
          : > "$WORK/.agents/vendor/drop.md"
          : > "$WORK/context/.backups/drop.md"
          : > "$WORK/AGENTS.md"
          got="$(knowledge_files "$WORK" | tr '\n' ' ')"
          echo "got: $got"
          [ "$got" = "AGENTS.md notes/keep.md " ] || { echo "unexpected knowledge set" >&2; exit 1; }
          echo "OK: .cortexignore filtering is correct"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: bash and the MCP brain agree on what counts as knowledge
        run: |
          set -euo pipefail
          # The vault's contract is that .cortexignore is the single source of truth. The bash
          # generators and mcp/lib/recall.js are two implementations of it; they must not diverge.
          . tools/_cortex-lib.sh
          knowledge_files . | sort > /tmp/from-bash.txt
          node --input-type=module -e '
            import { listMarkdown } from "./mcp/lib/recall.js";
            import { sep } from "node:path";
            const root = process.cwd();
            console.log(listMarkdown(root).map((p) => p.slice(root.length + 1).split(sep).join("/")).sort().join("\n"));
          ' | sort > /tmp/from-node.txt
          echo "--- bash ($(wc -l < /tmp/from-bash.txt) files) ---"; cat /tmp/from-bash.txt
          diff /tmp/from-bash.txt /tmp/from-node.txt \
            && echo "OK: bash and node produce an identical knowledge set"

      - name: Run cortex-init.sh against a dummy repo
        run: |
          set -euo pipefail
          SCRIPT="$PWD/tools/cortex-init.sh"
          WORK="$(mktemp -d)"; cd "$WORK"; git init -q
          cat > package.json <<'JSON'
          {"name":"dummy","scripts":{"dev":"next dev","build":"next build","lint":"eslint ."},"dependencies":{"next":"^15","react":"^19"}}
          JSON
          echo '{"compilerOptions":{"strict":true,"paths":{"@/*":["./src/*"]}}}' > tsconfig.json
          bash "$SCRIPT" --yes
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .claude/skills/plan-feature/SKILL.md
          grep -q "Next.js" AGENTS.md
          echo "OK: bash installer produced a valid brain"

          test -f "$WORK/.claude/settings.json"
          grep -q '"superpowers@claude-plugins-official": true' "$WORK/.claude/settings.json"
          grep -q 'anthropics/claude-plugins-official' "$WORK/.claude/settings.json"
          echo "OK: core plugin bundle stamped into .claude/settings.json"
