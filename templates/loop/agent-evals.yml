# Re-checks the agent's behaviour whenever the files that steer it change.
#
# CLAUDE.md, AGENTS.md, REVIEW.md and .claude/ shape what the agent does as much as source shapes
# what the program does, so an edit to them is tested before it merges.
#
# Each file under evals/cases/ is one real past task: a prompt, plus a script that exits non-zero
# when the result is unacceptable. Start from work the team actually did — invented cases prove
# nothing. When something breaks in production, its case gets added here and never removed.
# Only {{TEST_CMD}} is a Cortex placeholder. ${{ secrets.ANTHROPIC_API_KEY }} is GitHub Actions
# syntax, resolved at run time from the repo's secrets — leave it exactly as written.
name: agent-evals

on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', 'REVIEW.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '17 3 * * *'

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run every case
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          failed=0
          for dir in evals/cases/*/; do
            name="$(basename "$dir")"
            claude -p "$(cat "$dir/prompt.md")" \
              --allowedTools "Read,Edit,Bash({{TEST_CMD}})" \
              --output-format json > "/tmp/$name.json"
            if "$dir/accept.sh" "/tmp/$name.json"; then echo "pass  $name"; else echo "FAIL  $name"; failed=1; fi
          done
          exit "$failed"
