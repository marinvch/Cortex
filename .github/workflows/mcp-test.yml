name: mcp test
on:
  push:
    paths: ["mcp/**", "plugins/**", "tools/cortex-init.sh", "VERSION", ".github/workflows/mcp-test.yml"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # Git Bash exists on the Windows runners, so one shell covers the whole matrix.
    shell: bash

jobs:
  test:
    # Windows is the primary development platform for this repo and lib/capture.js carries
    # explicit path-separator handling, so it has to be exercised here — not just on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (for sync tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Test
        working-directory: mcp
        run: npm test
