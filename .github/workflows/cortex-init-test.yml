name: cortex-init test

on:
  push:
    paths:
      - "tools/cortex-init.mjs"
      - "package.json"
      - ".github/workflows/cortex-init-test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run cortex-init against a dummy repo
        run: |
          set -euo pipefail
          SCRIPT="$PWD/tools/cortex-init.mjs"
          WORK="$(mktemp -d)"
          cd "$WORK"

          # minimal React/Vite/TS dummy project
          cat > package.json <<'JSON'
          {
            "name": "dummy-app",
            "dependencies": { "react": "^18", "vite": "^5", "tailwindcss": "^3" },
            "devDependencies": { "typescript": "^5", "vitest": "^1" },
            "scripts": { "dev": "vite", "build": "vite build", "test": "vitest", "lint": "eslint ." }
          }
          JSON
          mkdir -p src public

          # answer the wizard prompts: name, purpose, convention, agents
          printf 'DummyApp\nA test project\nNo console.logs in committed code\nall\n' | node "$SCRIPT"

          echo "=== generated tree ==="
          find . -type f -not -name package.json | sort

      - name: Assert the brain files exist
        run: |
          set -euo pipefail
          # Regenerate in a fresh dir and assert the output here (cheap + deterministic).
          SCRIPT="$PWD/tools/cortex-init.mjs"
          DIR="$(mktemp -d)"; cd "$DIR"
          printf '{ "name": "dummy", "dependencies": { "react": "^18" } }' > package.json
          printf 'DummyApp\nA test project\n\nall\n' | node "$SCRIPT" >/dev/null

          fail=0
          for f in \
            AGENTS.md \
            CLAUDE.md \
            GEMINI.md \
            .github/copilot-instructions.md \
            .cursor/rules/project.mdc \
            .claude/skills/plan-feature/SKILL.md \
            .claude/skills/investigate-bug/SKILL.md \
            docs/decisions.md
          do
            if [ -f "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done

          # AGENTS.md must mention the detected framework
          grep -q "React" AGENTS.md || { echo "AGENTS.md missing detected stack"; fail=1; }

          exit $fail
