# Control bands: a plan for turning production drift into the next intent.md.
#
# Cortex does not run this file. It ships no detector and nothing reads these values, so no band is
# checked until your team writes a script that does. Make that script plain arithmetic, a rolling
# mean and deviation with unit tests, so no model decides that a band was breached. A model is asked
# only afterwards, to explain the breach, and each tier caps what it may do about it.
# Cortex stops stamping this template in 4.0.0. A copy already in your repo stays yours.
#
# Fill in one metric that has a stable history. Add more only once this one is quiet.
watch:
  metric: {{METRIC}}
  window: 30d
  drift_rules: western_electric

respond:
  - at: 1sigma
    do: record # log only; no agent runs
  - at: 2sigma
    do: explain # agent runs read-only and writes intent.md
    allowed_tools: "Read,Grep,Bash({{READONLY_CMD}})"
  - at: 3sigma
    do: propose # agent may open a PR or run a runbook approved in advance — nothing else
    routes: [pull_request, "runbook:{{RUNBOOK}}"]
