name: "Cortex Validate"

on:
  pull_request:
    branches: [dev]
    paths:
      - "engine/src/**"
      - "engine/scripts/**"
      - "engine/docs/mcp-tools.md"
      - "engine/package.json"
      - "engine/package-lock.json"
      - "engine/tsconfig.json"
      - ".github/workflows/**"
  push:
    branches: [dev, master]
    paths:
      - "engine/src/**"
      - "engine/scripts/**"
      - "engine/docs/mcp-tools.md"
      - "engine/package.json"
      - "engine/package-lock.json"
      - "engine/tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: cortex-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: engine/package-lock.json

      - name: Version lockstep check
        working-directory: .
        run: |
          node -e "const r=require('./package.json').version,e=require('./engine/package.json').version; if(r!==e){console.error('version mismatch root='+r+' engine='+e);process.exit(1)} else console.log('versions match: '+r)"

      - name: Install dependencies
        run: npm ci

      - name: Fast ops validation (build + unit tests + scorecard freshness)
        run: npm run validate:ops

      - name: Regression suite (pre-merge gate)
        run: npm run validate

      - name: Smoke validation (feature health checks)
        run: npm run validate:smoke

      - name: Audit dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: MCP docs freshness check
        run: |
          npm run gen-mcp-docs
          git diff --exit-code docs/mcp-tools.md || (echo "engine/docs/mcp-tools.md is stale — run npm run gen-mcp-docs and commit" && exit 1)

  test-matrix:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

  validate-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: engine/package-lock.json

      - name: Version lockstep check
        working-directory: .
        run: |
          node -e "const r=require('./package.json').version,e=require('./engine/package.json').version; if(r!==e){console.error('version mismatch root='+r+' engine='+e);process.exit(1)} else console.log('versions match: '+r)"

      - name: Install dependencies
        run: npm ci

      - name: Full validation (build + unit tests + regression)
        run: npm run validate:full

      - name: Smoke validation (feature health checks)
        run: npm run validate:smoke

      - name: Audit dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: MCP docs freshness check
        run: |
          npm run gen-mcp-docs
          git diff --exit-code docs/mcp-tools.md || (echo "engine/docs/mcp-tools.md is stale — run npm run gen-mcp-docs and commit" && exit 1)

      - name: Scorecard regression check
        run: npm run scorecard:check

  self-scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run cortex against itself (dry-run)
        working-directory: .
        run: node engine/dist/generate.js --dry-run

      - name: Scorecard check (self-hosted regression gate)
        run: npm run scorecard:check
