# Re-checks the agent's behaviour whenever the files that steer it change.
#
# CLAUDE.md, AGENTS.md, REVIEW.md and .claude/ shape what the agent does as much as source shapes
# what the program does, so an edit to them is tested before it merges.
#
# Each folder under evals/cases/ is one real past task: a prompt.md, plus an accept.sh that exits
# non-zero when the result is unacceptable. Start from work the team actually did — invented cases
# prove nothing. When something breaks in production, its case gets added here and never removed.
#
# accept.sh judges the work, not the reply: run the test, read the diff, check the file. The final
# message of a run is a report of what the agent believes it did, not proof that it did it — a model
# can end its turn on a status update with the work still open. So a turn that ends cleanly while
# accept.sh still rejects the work is continued in the same session, at most twice; a case still
# rejected after that is reported PARTIAL and fails, so a run that is genuinely stuck ends and can
# be reviewed rather than nudged forever. A run that errors is a failure and is never continued.
# Anthropic's guidance for Claude Opus 5.5 — "stop after two or three automatic continuations".
#
# Claude Code runs without --bare on purpose. Bare mode skips CLAUDE.md, skills and hooks, which are
# the configuration these cases exist to regress.
#
# Two lines are Cortex placeholders, in double braces with no dollar sign: the setup steps below the
# checkout, and the test command in --allowedTools. A dollar-sign expression such as the secret
# below is GitHub Actions syntax, resolved at run time — leave it exactly as written.
name: agent-evals

on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', 'REVIEW.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The steps from this repo's own CI that install its toolchain and dependencies, copied as
      # they are there, so the test command runs here the way it runs there. None needed: delete it.
      {{SETUP_STEPS}}
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run every case
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::No ANTHROPIC_API_KEY in this run (a fork's pull request, or the secret is unset) — cases skipped."
            exit 0
          fi
          cases=(evals/cases/*/)
          if [ "${#cases[@]}" -eq 0 ]; then
            echo "::notice::evals/cases/ holds no cases yet — add one folder per real past task, with prompt.md and accept.sh."
            exit 0
          fi
          flags=(--permission-mode dontAsk --allowedTools "Read,Edit,Bash({{TEST_CMD}} *)" --output-format json)
          max_continuations=2
          nudge="Your last turn ended, but the task is not finished yet. Continue it to completion, then stop."
          failed=0
          for dir in "${cases[@]}"; do
            dir="${dir%/}"
            name="$(basename "$dir")"
            out="$RUNNER_TEMP/$name.json"
            if [ ! -f "$dir/prompt.md" ] || [ ! -f "$dir/accept.sh" ]; then
              echo "FAIL  $name — a case needs prompt.md and accept.sh"; failed=1; continue
            fi
            status="FAIL "; note=""; continued=0
            if ! claude -p "$(cat "$dir/prompt.md")" "${flags[@]}" > "$out"; then
              note=" — claude exited non-zero: $(head -c 400 "$out")"
            else
              while :; do
                if bash "$dir/accept.sh" "$out"; then status="pass "; break; fi
                # Only a clean end of turn is a report to continue from; an error is a result.
                if ! grep -Eq '"is_error"[[:space:]]*:[[:space:]]*false' "$out"; then
                  note=" — the run ended in an error: $(head -c 400 "$out")"; break
                fi
                if [ "$continued" -ge "$max_continuations" ]; then
                  status="PARTIAL"; note=" — accept.sh still rejects the work after $continued continuations"; break
                fi
                continued=$((continued + 1))
                if ! claude -p "$nudge" --continue "${flags[@]}" > "$out"; then
                  note=" — claude exited non-zero on continuation $continued: $(head -c 400 "$out")"; break
                fi
              done
            fi
            [ "$status" = "pass " ] || failed=1
            [ "$status" = "pass " ] && [ "$continued" -gt 0 ] && note=" (after $continued continuation(s))"
            echo "$status $name$note"
            # The next case starts from the committed tree. Ignored files — installed dependencies —
            # survive, because clean without -x leaves them.
            git reset --hard -q && git clean -fdq
          done
          exit "$failed"
